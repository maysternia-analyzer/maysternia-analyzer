[build]
builder = "nixpacks"

[deploy]
# 2 процеси × 4 потоки (gthread). Фонові задачі виконує лише один процес (файловий lock).
startCommand = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --timeout 600 --graceful-timeout 30 --access-logfile - --error-logfile - --no-control-socket"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
